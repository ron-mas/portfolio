<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Work | Portfolio</title>
  <link rel="stylesheet" href="../css/style.css">
</head>

<body>

  <header class="site-header">

    <a class="logo" href="../index.html">
      Portfolio
    </a>

    <nav>
      <a href="../index.html">WORKS</a>
      <a href="../profile.html">PROFILE</a>
    </nav>

  </header>


  <main>

    <article id="work-detail" class="work-detail">

      <div class="work-back">
        <a href="../index.html">← 一覧に戻る</a>
      </div>


      <header class="work-header">

        <div class="work-detail-card">

          <div class="work-detail-heading">

            <div
              class="category-tag"
              id="work-category"
            ></div>

            <h1 id="work-title"></h1>

            <p id="work-overview"></p>

          </div>


          <div class="work-info">

            <div class="work-info-column">

              <div class="work-info-item">
                <dt>担当</dt>
                <dd id="info-areas"></dd>
              </div>

              <div class="work-info-item">
                <dt>ツール</dt>
                <dd id="info-tools"></dd>
              </div>

            </div>


            <div class="work-info-column">

              <div class="work-info-item">
                <dt>所属/CL</dt>
                <dd id="info-company"></dd>
              </div>

              <div class="work-info-item">
                <dt>制作年</dt>
                <dd id="info-year"></dd>
              </div>

            </div>

          </div>

        </div>

      </header>


      <div
        id="work-content"
        class="work-content"
      ></div>


      <nav class="work-pager">

  <a
    id="bottom-prev"
    href="#"
    class="pager-prev"
  >
    <span class="pager-arrow">◀</span>
    <strong></strong>
  </a>

  <a
    id="bottom-next"
    href="#"
    class="pager-next"
  >
    <strong></strong>
    <span class="pager-arrow">▶</span>
  </a>

</nav>
      
    </article>

  </main>


  <script src="../data.js"></script>
  <script src="../js/work.js"></script>

</body>
</html>
