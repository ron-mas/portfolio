<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Work | Portfolio</title>
  <link rel="stylesheet" href="../css/style.css">
</head>

<body>

  <header class="site-header">
    <a class="logo" href="../index.html">Portfolio</a>

    <nav>
      <a href="../index.html">WORKS</a>
      <a href="../profile.html">PROFILE</a>
    </nav>
  </header>


  <main>

    <article id="work-detail" class="work-detail">

      <!-- 一覧へ戻る -->
      <div class="work-back">
        <a href="../index.html">← 一覧に戻る</a>
      </div>


      <!-- 作品情報カード -->
      <header class="work-header">

        <div class="work-card">

          <div class="work-card-heading">

            <div class="eyebrow" id="work-category"></div>

            <h1 id="work-title"></h1>

            <p id="work-overview"></p>

          </div>


          <div class="work-info">

            <div class="work-info-column">

              <div class="work-info-item">
                <dt>担当</dt>
                <dd id="info-areas"></dd>
              </div>

              <div class="work-info-item">
                <dt>ツール</dt>
                <dd id="info-tools"></dd>
              </div>

            </div>


            <div class="work-info-column">

              <div class="work-info-item">
                <dt>所属</dt>
                <dd id="info-company"></dd>
              </div>

              <div class="work-info-item">
                <dt>制作年</dt>
                <dd id="info-year"></dd>
              </div>

            </div>

          </div>

        </div>

      </header>


      <!-- 作品本文 -->
      <div id="work-content" class="work-content"></div>


      <!-- ページャー -->
      <nav class="work-pager">

        <!-- 左：次の実績 -->
        <a id="bottom-next" href="#">
          <span class="pager-arrow">←</span>

          <div>
            <small>次の実績</small>
            <strong></strong>
          </div>
        </a>


        <!-- 右：前の実績 -->
        <a id="bottom-prev" href="#">
          <div>
            <small>前の実績</small>
            <strong></strong>
          </div>

          <span class="pager-arrow">→</span>
        </a>

      </nav>

    </article>

  </main>


  <script src="../data.js"></script>
  <script src="../js/work.js"></script>

</body>
</html>
