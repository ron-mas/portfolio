<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Portfolio">
  <title>Portfolio</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<script src="js/komorebi.js"></script>
  
<body class="locked">
  
  <div class="komorebi-overlay" aria-hidden="true"></div>
  <div id="password-screen" class="password-screen">
  <div class="password-box">

    <h1>Portfolio</h1>

    <form id="password-form">

      <label class="sr-only" for="password">
        Password
      </label>

      <input
        id="password"
        type="password"
        autocomplete="current-password"
        placeholder="Password"
      >

      <button type="submit">
        LOGIN
      </button>

      <p
        id="password-error"
        class="error"
        aria-live="polite"
      ></p>

    </form>

  </div>
</div>


  <div id="site" hidden>

    <header class="site-header">
      <a class="logo" href="index.html">Portfolio</a>

      <nav>
        <a class="is-current" href="index.html">WORKS</a>
        <a href="profile.html">PROFILE</a>
      </nav>
    </header>


    <main>

      <section class="works-page">


        <div class="works-controls">

          <div id="filters" class="filter-list" aria-label="カテゴリ">

            <button
              class="filter is-active"
              data-category="all"
            >
              すべて
            </button>

            <button
              class="filter"
              data-category="illustration"
            >
              イラスト
            </button>

            <button
              class="filter"
              data-category="advertising"
            >
              広告
            </button>

            <button
              class="filter"
              data-category="web"
            >
              Web
            </button>

            <button
              class="filter"
              data-category="goods"
            >
              グッズ
            </button>

          </div>


          <label class="sort">
            <span>並び順</span>

            <select id="sort">
              <option value="new">新しい順</option>
              <option value="old">古い順</option>
            </select>
          </label>

        </div>


        <div id="works-grid" class="works-grid"></div>

      </section>

    </main>

  </div>


  <script src="data.js"></script>
  <script src="js/site.js"></script>

</body>
</html>
